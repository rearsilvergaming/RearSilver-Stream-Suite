<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RearSilver Stream Suite | Control Hub</title>
<style>
html,body,#pages{width:100%;height:100%;margin:0;overflow:hidden;background:#0b0f14}
#pages{position:relative}
.page{position:absolute;inset:0;width:100%;height:100%;margin:0;border:0;display:none;background:#0b0f14}
.page.active{display:block}
#loading{position:absolute;inset:0;z-index:2;padding:30px;background:#0b0f14;color:#b2bdcc;font:15px "Segoe UI",sans-serif}#loading[hidden]{display:none}
</style></head>
<body><div id="pages"></div><div id="loading" role="status" aria-live="polite">Loading Control Hub…</div><script>
const pages=document.getElementById('pages');
const loading=document.getElementById('loading');
const frames=new Map();
let warming=false;
let activeFrame=null;
let pendingFrame=null;
let loadingTimer=null;

// Child pages live in same-origin iframes. Route their commands through this
// single top-level WebView2 surface so native code receives one message stream.
window.rsNativePost=message=>window.chrome.webview.postMessage(message);

function createPage(url){
  let frame=frames.get(url);
  if(frame)return frame;
  frame=document.createElement('iframe');
  frame.className='page';
  frame.title='Control Hub page';
  frame.src=url;
  pages.appendChild(frame);
  frames.set(url,frame);
  return frame;
}

let readinessGeneration=0;
function announceWhenReady(frame,functionName,readyMessage,generation,attempt=0){
  if(generation!==readinessGeneration||frame!==pendingFrame)return;
  try{
    const target=frame.contentWindow;
    if(target&&typeof target[functionName]==='function'){
      window.chrome.webview.postMessage(readyMessage);
      return;
    }
  }catch(_){}
  if(attempt===100)loading.textContent='This page is taking longer to load…';
  setTimeout(()=>announceWhenReady(frame,functionName,readyMessage,generation,attempt+1),attempt<100?50:1000);
}

function activatePage(frame){
  if(frame!==pendingFrame)return;
  if(loadingTimer){clearTimeout(loadingTimer);loadingTimer=null}
  if(activeFrame&&activeFrame!==frame)activeFrame.classList.remove('active');
  activeFrame=frame;
  pendingFrame=null;
  activeFrame.classList.add('active');
  loading.hidden=true;
}
function waitWithoutFlashing(){
  if(loadingTimer){clearTimeout(loadingTimer);loadingTimer=null}
  if(!activeFrame){loading.hidden=false;return}
  loading.hidden=true;
  loadingTimer=setTimeout(()=>{
    loadingTimer=null;
    if(pendingFrame){loading.textContent='Loading page…';loading.hidden=false}
  },150);
}
window.rsShowPage=function(url,functionName,readyMessage){
  if(!url)return;
  const next=createPage(url);
  pendingFrame=next;
  const generation=++readinessGeneration;
  if(next.rsConfigured){activatePage(next);return}
  waitWithoutFlashing();
  if(functionName&&readyMessage)announceWhenReady(next,functionName,readyMessage,generation);
};
window.rsInvokeAll=function(name,value){
  let handled=false;
  for(const frame of frames.values()){
    try{
      const target=frame.contentWindow;
      if(target&&typeof target[name]==='function'){
        target[name](value);
        handled=true;
        if(!frame.rsConfigured){
          frame.rsConfigured=true;
        }
        if(frame===pendingFrame)activatePage(frame); if(frame===activeFrame)warmPages()
      }
    }catch(_){
      if(!frame.rsErrorReported){
        frame.rsErrorReported=true;
        window.chrome.webview.postMessage('hub-page-error:'+new URL(frame.src).pathname);
      }
      if(frame===pendingFrame){if(loadingTimer){clearTimeout(loadingTimer);loadingTimer=null}loading.textContent='This page could not finish loading. Try another page and return, or reopen the Hub.';loading.hidden=false}
    }
  }
  return handled;
};
window.rsActiveHas=function(name){
  const target=activeFrame&&activeFrame.contentWindow;
  return !!(target&&typeof target[name]==='function');
};
for(const name of ['rsApplyLibrary','rsApplyConfig','rsApplyCommands','rsApplyTools','rsApplySuiteSettings','rsApplyFeedbackDiagnostics'])
  window[name]=value=>window.rsInvokeAll(name,value);

window.chrome.webview.postMessage('hub-ready');

// Start background loading only after the active page has received its
// configuration. Stagger it so old machines can paint the requested page first.
function warmPages(){
  if(warming)return;
  warming=true;
  const remaining=['stream-tools','library','overlay-designer','suite-settings','commands','feedback-diagnostics'];
  const next=()=>{
    const name=remaining.shift();
    if(!name)return;
    createPage('https://app.rearsilver.test/'+name+'.html');
    if(remaining.length)setTimeout(next,700);
  };
  setTimeout(next,700);
}
</script></body></html>
