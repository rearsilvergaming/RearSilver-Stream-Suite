<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:Sora;src:url('Sora-Variable.ttf')}*{box-sizing:border-box}body{margin:0;background:#111821;color:#e6e8eb;font:14px Sora,Segoe UI,sans-serif}button,input,select{font:inherit}.shell{padding:22px;min-height:100vh}.tabs{display:flex;gap:10px;margin-bottom:18px}.tab,.btn{border:1px solid #303b4a;background:#1e2430;color:#b2bdcc;border-radius:9px;padding:10px 18px;cursor:pointer}.tab.active,.btn.primary{background:#073f50;border-color:#00d4ff;color:#fff;box-shadow:0 0 18px #00d4ff24}.section{display:none}.section.active{display:block}.intro{color:#8fa1b7;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:12px}.grid.three{grid-template-columns:repeat(3,minmax(180px,1fr))}.card{background:#1e2430;border:1px solid #303b4a;border-radius:12px;padding:14px}.label{display:block;color:#8fa1b7;font-size:12px;margin-bottom:8px}.control{width:100%;height:40px;border:1px solid #3a4759;border-radius:8px;background:#111821;color:#e6e8eb;padding:0 12px;outline:none}.control:focus{border-color:#00d4ff;box-shadow:0 0 0 3px #00d4ff22}.toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer}.switch{width:44px;height:24px;border-radius:12px;background:#3a4759;padding:3px;transition:.15s}.switch:after{content:'';display:block;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}.toggle.on .switch{background:#00a9ce}.toggle.on .switch:after{transform:translateX(20px)}.preset{display:grid;grid-template-columns:1fr 110px;gap:8px}.colour-row{display:grid;grid-template-columns:46px 1fr;gap:10px}.swatch{height:40px;border:1px solid #536176;border-radius:8px;cursor:pointer}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:#71849c;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#05080dbb;align-items:center;justify-content:center;z-index:20}.modal.open{display:flex}.picker{width:min(620px,92vw);background:#111821;border:1px solid #3a4759;border-radius:16px;padding:20px;box-shadow:0 24px 80px #000a}.picker-body{display:grid;grid-template-columns:300px 1fr;gap:18px}.sv{width:300px;height:220px;border-radius:8px;cursor:crosshair}.hue{width:300px;margin:12px 0}.preview{height:72px;border-radius:10px;border:1px solid #536176;margin-bottom:12px}.rgb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.picker-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.swatches{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.mini{width:28px;height:28px;border-radius:6px;border:1px solid #536176;cursor:pointer}@media(max-width:850px){.grid,.grid.three{grid-template-columns:1fr}.picker-body{grid-template-columns:1fr}.sv,.hue{width:100%}}
</style></head><body><main class="shell">
<div class="tabs"><button class="tab active" data-page="content">Content</button><button class="tab" data-page="style">Style &amp; Canvas</button></div>
<section id="content" class="section active"><p class="intro">Choose exactly what viewers see. Changes save instantly to the live OBS overlay.</p><div id="toggles" class="grid"></div>
<div class="grid" style="margin-top:12px"><div class="card"><label class="label">Artwork position</label><select id="artworkPosition" class="control"><option value="left">Left</option><option value="right">Right</option></select></div><div class="card"><label class="label">Timing</label><select id="timingMode" class="control"><option value="elapsedTotal">Elapsed / total</option><option value="elapsed">Elapsed only</option><option value="remaining">Remaining</option><option value="elapsedRemaining">Elapsed and remaining</option><option value="none">Hidden</option></select></div><div class="card"><label class="label">Custom heading or stream name</label><input id="customText" class="control" placeholder="Leave blank to hide"></div></div></section>
<section id="style" class="section"><p class="intro">Use a preset as a starting point or enter any custom value.</p><div class="grid three">
<div class="card"><label class="label">Font</label><select id="fontFamily" class="control"></select></div>
<div class="card"><label class="label">Title size</label><div class="preset"><select id="titlePreset" class="control"><option value="24">Small</option><option value="34">Medium</option><option value="44">Large</option><option value="custom">Custom</option></select><input id="titleSize" type="number" min="8" max="240" class="control"></div></div>
<div class="card"><label class="label">Body size</label><div class="preset"><select id="bodyPreset" class="control"><option value="14">Small</option><option value="20">Medium</option><option value="28">Large</option><option value="custom">Custom</option></select><input id="bodySize" type="number" min="6" max="160" class="control"></div></div>
<div class="card"><label class="label">Long title behaviour</label><select id="titleOverflow" class="control"><option value="ellipsis">Shorten with …</option><option value="fit">Automatically fit</option><option value="scroll">Scroll continuously</option></select></div>
<div class="card" id="scrollDirectionCard"><label class="label">Scroll direction</label><select id="scrollDirection" class="control"><option value="left">Right to left</option><option value="right">Left to right</option></select></div>
<div class="card" id="scrollSpeedCard"><label class="label">Scroll speed</label><div class="preset"><select id="speedPreset" class="control"><option value="25">Slow</option><option value="45">Medium</option><option value="70">Fast</option><option value="custom">Custom</option></select><input id="scrollSpeed" type="number" min="10" max="200" class="control" title="Pixels per second"></div></div>
<div class="card"><label class="label">Background opacity</label><div class="preset"><select id="opacityPreset" class="control"><option value="0">Transparent</option><option value="50">Soft</option><option value="82">Strong</option><option value="100">Solid</option><option value="custom">Custom</option></select><input id="backgroundOpacity" type="number" min="0" max="100" class="control"></div></div>
<div class="card colour" data-key="backgroundColour"><label class="label">Background colour</label><div class="colour-row"><button class="swatch"></button><input class="control hex"></div></div>
<div class="card colour" data-key="textColour"><label class="label">Text colour</label><div class="colour-row"><button class="swatch"></button><input class="control hex"></div></div>
<div class="card colour" data-key="accentColour"><label class="label">Accent colour</label><div class="colour-row"><button class="swatch"></button><input class="control hex"></div></div>
<div class="card"><label class="label">Canvas width</label><div class="preset"><select id="widthPreset" class="control"><option value="600">Compact</option><option value="800">Standard</option><option value="1200">Wide</option><option value="custom">Custom</option></select><input id="width" type="number" min="240" max="3840" class="control"></div></div>
<div class="card"><label class="label">Canvas height</label><div class="preset"><select id="heightPreset" class="control"><option value="180">Compact</option><option value="240">Standard</option><option value="360">Tall</option><option value="custom">Custom</option></select><input id="height" type="number" min="100" max="2160" class="control"></div></div>
</div></section><div class="actions"><span>All values are stored locally.</span><button id="reset" class="btn">Reset to defaults</button></div></main>
<div id="modal" class="modal"><div class="picker"><h2 style="margin-top:0">Choose colour</h2><div class="picker-body"><div><canvas id="sv" class="sv" width="600" height="440"></canvas><input id="hue" class="hue" type="range" min="0" max="360"><div class="swatches" id="swatches"></div></div><div><div id="preview" class="preview"></div><label class="label">HEX</label><input id="pickerHex" class="control"><div class="rgb" style="margin-top:10px"><div><label class="label">R</label><input id="r" type="number" min="0" max="255" class="control"></div><div><label class="label">G</label><input id="g" type="number" min="0" max="255" class="control"></div><div><label class="label">B</label><input id="b" type="number" min="0" max="255" class="control"></div></div></div></div><div class="picker-actions"><button id="cancel" class="btn">Cancel</button><button id="apply" class="btn primary">Apply colour</button></div></div></div>
<script>(()=>{
const post=(key,value,type='string')=>chrome.webview.postMessage(JSON.stringify({key,value,type}));
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.page).classList.add('active')});
const toggleDefs=[['showArtwork','Artwork'],['showTitle','Track title'],['showArtist','Artist'],['showAlbum','Album'],['showRequester','Requested by'],['showProgress','Progress bar'],['artworkBackground','Blurred artwork background'],['backgroundTransparent','Transparent background']];
toggleDefs.forEach(([key,name])=>{const e=document.createElement('div');e.className='card toggle';e.dataset.key=key;e.innerHTML=`<span>${name}</span><span class="switch"></span>`;e.onclick=()=>{e.classList.toggle('on');post(key,e.classList.contains('on'),'bool')};toggles.appendChild(e)});
const updateScrollControls=()=>{const visible=titleOverflow.value==='scroll';scrollDirectionCard.style.display=scrollSpeedCard.style.display=visible?'block':'none'};
['artworkPosition','timingMode','fontFamily','titleOverflow','scrollDirection'].forEach(id=>document.getElementById(id).onchange=e=>{post(id,e.target.value);if(id==='titleOverflow')updateScrollControls()});customText.oninput=e=>{post('customText',e.target.value);post('showCustomText',!!e.target.value,'bool')};
const fonts=['Sora','Arial','Segoe UI','Calibri','Verdana','Tahoma','Trebuchet MS','Georgia','Times New Roman','Impact','Comic Sans MS'];fonts.forEach(f=>fontFamily.add(new Option(f,f)));
[['title','titleSize'],['body','bodySize'],['speed','scrollSpeed'],['opacity','backgroundOpacity'],['width','width'],['height','height']].forEach(([p,id])=>{const input=document.getElementById(id),sel=document.getElementById(p+'Preset');sel.onchange=()=>{if(sel.value!=='custom'){input.value=sel.value;post(id,+sel.value,'number')}};input.oninput=()=>{sel.value=[...sel.options].some(o=>o.value===input.value)?input.value:'custom';if(input.value!=='')post(id,+input.value,'number')}});
let activeColour=null,h=190,s=1,v=1;const modal=document.getElementById('modal'),ctx=sv.getContext('2d');function hsvRgb(h,s,v){let f=(n,k=(n+h/60)%6)=>v-v*s*Math.max(0,Math.min(k,4-k,1));return [f(5),f(3),f(1)].map(x=>Math.round(x*255))}function rgbHex(a){return '#'+a.map(x=>x.toString(16).padStart(2,'0')).join('')}function hexRgb(x){x=x.replace('#','');if(x.length===3)x=[...x].map(c=>c+c).join('');return [parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),parseInt(x.slice(4,6),16)]}function draw(){let hue=ctx.createLinearGradient(0,0,sv.width,0);hue.addColorStop(0,'#fff');hue.addColorStop(1,`hsl(${h} 100% 50%)`);ctx.fillStyle=hue;ctx.fillRect(0,0,sv.width,sv.height);let shade=ctx.createLinearGradient(0,0,0,sv.height);shade.addColorStop(0,'transparent');shade.addColorStop(1,'#000');ctx.fillStyle=shade;ctx.fillRect(0,0,sv.width,sv.height);sync(hsvRgb(h,s,v))}function sync(rgb){const hex=rgbHex(rgb);preview.style.background=hex;pickerHex.value=hex;r.value=rgb[0];g.value=rgb[1];b.value=rgb[2]}hue.oninput=()=>{h=+hue.value;draw()};sv.onpointerdown=sv.onpointermove=e=>{if(e.buttons||e.type==='pointerdown'){const q=sv.getBoundingClientRect();s=Math.max(0,Math.min(1,(e.clientX-q.left)/q.width));v=1-Math.max(0,Math.min(1,(e.clientY-q.top)/q.height));draw()}};pickerHex.oninput=()=>{if(/^#[0-9a-f]{6}$/i.test(pickerHex.value))sync(hexRgb(pickerHex.value))};[r,g,b].forEach(x=>x.oninput=()=>sync([+r.value,+g.value,+b.value].map(n=>Math.max(0,Math.min(255,n||0)))));document.querySelectorAll('.colour').forEach(card=>{const sw=card.querySelector('.swatch'),hex=card.querySelector('.hex');sw.onclick=()=>{activeColour=card;const rgb=hexRgb(hex.value||'#ffffff');sync(rgb);modal.classList.add('open');draw()};hex.oninput=()=>{if(/^#[0-9a-f]{6}$/i.test(hex.value)){sw.style.background=hex.value;post(card.dataset.key,hex.value)}}});cancel.onclick=()=>modal.classList.remove('open');apply.onclick=()=>{const hex=pickerHex.value.toLowerCase();activeColour.querySelector('.hex').value=hex;activeColour.querySelector('.swatch').style.background=hex;post(activeColour.dataset.key,hex);modal.classList.remove('open')};['#0b0f14','#111821','#1e2430','#e6e8eb','#00d4ff','#0a8cff','#ffb800'].forEach(c=>{const x=document.createElement('button');x.className='mini';x.style.background=c;x.onclick=()=>sync(hexRgb(c));swatches.appendChild(x)});
window.rsApplyConfig=c=>{toggleDefs.forEach(([k])=>document.querySelector(`.toggle[data-key="${k}"]`).classList.toggle('on',!!c[k]));['artworkPosition','timingMode','fontFamily','titleOverflow','scrollDirection','customText','titleSize','bodySize','scrollSpeed','backgroundOpacity','width','height'].forEach(k=>{const e=document.getElementById(k);if(e)e.value=c[k]??''});[['titlePreset','titleSize'],['bodyPreset','bodySize'],['speedPreset','scrollSpeed'],['opacityPreset','backgroundOpacity'],['widthPreset','width'],['heightPreset','height']].forEach(([preset,key])=>{const select=document.getElementById(preset),value=String(c[key]??'');select.value=[...select.options].some(o=>o.value===value)?value:'custom'});document.querySelectorAll('.colour').forEach(card=>{const v=c[card.dataset.key]||'#ffffff';card.querySelector('.hex').value=v;card.querySelector('.swatch').style.background=v});updateScrollControls()};reset.onclick=()=>chrome.webview.postMessage(JSON.stringify({action:'reset'}));chrome.webview.postMessage('ready');draw();updateScrollControls();
})();</script></body></html>
